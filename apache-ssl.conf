<VirtualHost *:443>
    ServerName hub.self.com
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hub-self-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/hub-self-ssl-access.log combined
</VirtualHost>
